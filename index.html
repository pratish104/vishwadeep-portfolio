    <!-- Google Fonts: Plus Jakarta Sans, DM Serif Display, JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=JetBrains+Mono:ital,wght@0,300..800;1,300..800&family=Plus+Jakarta+Sans:ital,wght@0,300..800;1,300..800&display=swap"
      rel="stylesheet"
    />

    <!-- Theme initialization script (prevents flash of wrong theme) -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('portfolio_theme');
          var theme = (saved && ['dark', 'light', 'anime'].indexOf(saved) !== -1) ? saved : 'dark';
          document.documentElement.setAttribute('data-theme', theme);
          if (theme === 'light') {
            document.documentElement.classList.remove('dark');
            document.documentElement.classList.add('light');
          } else {
            document.documentElement.classList.remove('light');
            document.documentElement.classList.add('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>

  <body class="bg-[#090a0f] text-zinc-100 antialiased selection:bg-indigo-500/25 selection:text-indigo-200 m-0 p-0">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
